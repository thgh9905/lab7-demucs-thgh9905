apiVersion: v1
kind: Namespace
metadata:
  name: minio-ns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-deployment
  namespace: minio-ns  
spec:
  replicas: 1
  selector:
    matchLabels: 
      app: minio
  template:
    metadata: 
      labels: 
        app: minio 
    spec: 
      containers:
      - name: minio
        image: cgr.dev/chainguard/minio:latest
        args: ["server", "/data", "--console-address", ":9001"]
        env: 
        - name: MINIO_ROOT_USER
          value: "rootuser"
        - name: MINIO_ROOT_PASSWORD
          value: "rootpass123"
        ports:
        - containerPort: 9000
        - containerPort: 9001
        volumeMounts:
        - name: data
          mountPath: /data
      volumes: 
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio-proj
  namespace: minio-ns
spec:
  selector:
    app: minio
  ports:
  - name: api
    port: 9000
    targetPort: 9000
  - name: console
    port: 9001
    targetPort: 9001
