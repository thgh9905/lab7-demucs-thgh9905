apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels: 
      app: worker
  template:
    metadata: 
      labels: 
        app: worker 
    spec: 
      containers:
      - name: worker
        image: thgh9905/demucs-worker:v1
        # args: ["server", "/data", "--console-address", ":9001"]
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
        env: 
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: MINIO_HOST
          value: "minio:9000"
        - name: MINIO_USER
          value: "rootuser"
        - name: MINIO_PASSWD
          value: "rootpass123"